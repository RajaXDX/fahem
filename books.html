<style>
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);line-height:1.75}
[hidden]{display:none!important}
.wrap{--acc:var(--gold);--acc-soft:var(--gold-soft);max-width:900px;margin:0 auto;padding-inline:16px;padding-block:20px 60px;display:flex;flex-direction:column;gap:14px}
.wrap[data-b="e"]{--acc:var(--social);--acc-soft:var(--social-soft)}
.wrap[data-b="i"]{--acc:var(--tajweed);--acc-soft:var(--tajweed-soft)}
a{color:var(--acc)}
h1{font-family:var(--display);font-size:clamp(1.4rem,4vw,2rem);margin:0}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* شاشة الاختيار */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:18px;max-width:720px;width:100%}
.stitle{font-family:var(--display);font-size:1.25rem;margin:0}
.ref{color:var(--muted);font-size:.85rem;margin:0}
.sstep{display:flex;flex-direction:column;gap:8px}
.sstep>b{font-size:.95rem}
.pick2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.bpick{appearance:none;font:inherit;text-align:right;color:var(--fg);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.bpick b{font-family:var(--display);font-size:1.05rem}
.bpick span{font-size:.82rem;color:var(--muted)}
.bpick[data-b="e"][aria-pressed="true"]{border-color:var(--social);background:var(--social-soft)}
.bpick[data-b="e"][aria-pressed="true"] b{color:var(--social)}
.bpick[data-b="i"][aria-pressed="true"]{border-color:var(--tajweed);background:var(--tajweed-soft)}
.bpick[data-b="i"][aria-pressed="true"] b{color:var(--tajweed)}
.chipbar{display:flex;gap:8px;flex-wrap:wrap}
.chipbar button{appearance:none;font:inherit;font-size:.88rem;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:4px 14px;cursor:pointer}
.chipbar button[aria-pressed="true"]{border-color:var(--acc);color:var(--acc);font-weight:600}
.btn{appearance:none;font:inherit;font-weight:600;border-radius:10px;padding:10px 20px;cursor:pointer;border:1.5px solid var(--acc);background:var(--acc);color:var(--surface);align-self:flex-start}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* عارض الكتاب */
.viewer{display:flex;flex-direction:column;gap:14px}
.back{appearance:none;border:0;background:none;color:var(--acc);font:inherit;font-weight:600;cursor:pointer;padding:0;align-self:flex-start}
.vtitle{font-family:var(--display);font-size:1.1rem;margin:0;color:var(--acc)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;display:flex;flex-direction:column;gap:8px}
.seg{display:inline-flex;gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;align-self:flex-start}
.seg button{appearance:none;border:0;background:none;color:var(--muted);font:inherit;font-weight:600;padding:6px 16px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--acc);color:var(--surface)}
.nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.nav button,.nav select{font:inherit;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:6px 12px;cursor:pointer;max-width:100%}
.nav input{width:5.5em;font:inherit;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:6px 10px}
.hint{color:var(--muted);font-size:.85rem;margin:0}
/* الصفحة والحلول المكتوبة عليها: المواقع بالنسبة المئوية من الصورة، والخط بـ cqw عشان يكبر ويصغر مع الصفحة */
.pg{position:relative;container-type:inline-size;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.pg img{display:block;width:100%;height:auto}
.ans{position:absolute;display:flex;flex-direction:column;justify-content:flex-start;margin:0;padding:0 .4cqw;font-family:"Noto Naskh Arabic","Noto Kufi Arabic",serif;font-weight:700;color:#1739a6;text-align:right;white-space:pre-line;text-shadow:0 0 .25cqw #fff,0 0 .25cqw #fff;cursor:pointer;border-radius:.6cqw;overflow:hidden;appearance:none;border:0;background:none}
.ans.one{justify-content:center}
.ans.mid{text-align:center}
.ans:hover,.ans[aria-expanded="true"]{background:rgb(246 200 68 / .28)}
.pop{position:absolute;inset-inline:3%;z-index:3;background:var(--surface);color:var(--fg);border:1.5px solid var(--acc);border-radius:12px;padding:10px 14px;box-shadow:0 10px 24px -8px rgb(0 0 0 / .35);font-size:1rem;line-height:1.7}
.pop small{display:block;color:var(--muted);font-size:.8rem}
.sol{background:var(--surface);border:1.5px solid var(--ok);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.sol[hidden]{display:none}
.sol h2{font-family:var(--display);font-size:1rem;margin:0;color:var(--ok)}
.q{font-weight:600}
.a{white-space:pre-line;background:var(--ok-soft);border-radius:10px;padding:8px 12px;margin-top:4px}
.pop b{display:block;white-space:pre-line;color:var(--acc)}
.ans sup,.pop sup,.a sup{font-size:.65em;line-height:0}
</style>
</head>

<div class="wrap" id="wrap" data-b="">
  <header class="top">

  <h1>الكتب</h1>

  <section class="card" id="setup"></section>

  <section class="viewer" id="viewer" hidden>
    <button type="button" class="back" id="change">→ غيّر الكتاب أو الوحدة</button>

        <button id="prev">→ السابقة</button>

<script>const SOL={e:{},i:{},m1:{},m2:{},c1:{},c2:{},l1:{},l2:{},d:{},en:{}};</script>

<script>
const N={e:258,i:246,m1:183,m2:201,c1:226,c2:228,l1:234,l2:242,d:358,en:272};
const NAME={e:"الاجتماعيات",i:"الدراسات الإسلامية",m1:"الرياضيات · الفصل الأول",m2:"الرياضيات · الفصل الثاني",c1:"العلوم · الفصل الأول",c2:"العلوم · الفصل الثاني",l1:"لغتي الخالدة · الجزء الأول",l2:"لغتي الخالدة · الجزء الثاني",d:"المهارات الرقمية · الفصلين",en:"اللغة الإنجليزية · Super Goal 1 (الفصلين)"};
/* ارتفاع صور الصفحات (العرض كله ١٢١١) */
const IMG_H={e:1454,i:1454,m1:1562,m2:1562,c1:1562,c2:1562,l1:1454,l2:1454,d:1454,en:1535};
/* بداية كل وحدة أو قسم (رقم الصفحة في الكتاب) */
const PARTS={
  e:[[10,"الوحدة الأولى: الكون والأرض"],[44,"الوحدة الثانية: الحضارات"],[76,"الوحدة الثالثة: التخطيط"],[90,"الوحدة الرابعة: العصر النبوي"],[150,"الوحدة الخامسة: عصر الخلفاء الراشدين"],[184,"الوحدة السادسة: الهوية الشخصية"],[202,"الوحدة السابعة: الأمن الوطني"],[236,"الوحدة الثامنة: الحوار"]],
  i:[[13,"التوحيد"],[55,"التفسير"],[119,"الحديث"],[167,"الفقه"]],
  m1:[[10,"الفصل ١: الجبر والدوال"],[48,"الفصل ٢: الأعداد الصحيحة"],[92,"الفصل ٣: المعادلات الخطية والدوال"],[138,"الفصل ٤: النسبة والتناسب"]],
  m2:[[10,"الفصل ٥: تطبيقات النسبة المئوية"],[42,"الفصل ٦: الإحصاء"],[74,"الفصل ٧: الاحتمال"],[96,"الفصل ٨: الهندسة: المضلعات"],[148,"الفصل ٩: القياس: الأشكال الثنائية والثلاثية الأبعاد"]],
  c1:[[16,"الفصل ١: طبيعة العلم"],[42,"الفصل ٢: الحركة والقوى والآلات البسيطة"],[80,"الفصل ٣: المادة وتغيراتها"],[102,"الفصل ٤: الذرات والعناصر والجدول الدوري"],[132,"الفصل ٥: الصخور والمعادن"],[160,"الفصل ٦: القوى المشكلة للأرض"]],
  c2:[[14,"الفصل ٧: الغلاف الجوي المتحرك"],[40,"الفصل ٨: استكشاف الفضاء"],[76,"الفصل ٩: الخلايا لبنات الحياة"],[98,"الفصل ١٠: الحيوانات اللافقارية"],[124,"الفصل ١١: الحيوانات الفقارية"],[156,"الفصل ١٢: علم البيئة"],[182,"الفصل ١٣: موارد الأرض"]],
  l1:[[12,"الوحدة الأولى: القيم الإسلامية"],[84,"الوحدة الثانية: الأعلام"],[160,"الوحدة الثالثة: الوطن"]],
  l2:[[12,"الوحدة الرابعة: الحياة الاجتماعية"],[92,"الوحدة الخامسة: البيئة والصحة"],[168,"الوحدة السادسة: حرف وهوايات"]],
  d:[[12,"ف١ · الوحدة الأولى: تعلم الأساسيات"],[58,"ف١ · الوحدة الثانية: معالجة النصوص المتقدمة"],[92,"ف١ · الوحدة الثالثة: التنسيق المتقدم والدوال"],[120,"ف١ · الوحدة الرابعة: البرمجة مع بايثون"],[164,"ف١ · اختبر نفسك"],[180,"ف٢ · الوحدة الأولى: الاتصال بالإنترنت"],[232,"ف٢ · الوحدة الثانية: الدوال المنطقية والمخططات"],[256,"ف٢ · الوحدة الثالثة: العرض التقديمي"],[302,"ف٢ · الوحدة الرابعة: برمجة الروبوت الافتراضي"],[345,"ف٢ · الذكاء الاصطناعي"],[351,"ف٢ · اختبر نفسك"]],
  en:[[8,"ف١ · Unit 1: Good Morning!"],[16,"ف١ · Unit 2: What Day Is Today?"],[24,"ف١ · Unit 3: What’s That?"],[32,"ف١ · Unit 4: Around the World"],[40,"ف١ · مراجعة الوحدات ١–٤"],[46,"ف١ · Unit 5: Families, Families"],[54,"ف١ · Unit 6: Is There a View?"],[62,"ف١ · Unit 7: Where Do You Live?"],[70,"ف١ · Unit 8: What Are You Doing?"],[78,"ف١ · مراجعة الوحدات ٥–٨"],[84,"ف٢ · Unit 9: What Do You Do?"],[92,"ف٢ · Unit 10: What’s School Like?"],[100,"ف٢ · Unit 11: What Time Do You Get Up?"],[108,"ف٢ · Unit 12: What Can You Do There?"],[116,"ف٢ · مراجعة الوحدات ٩–١٢"],[124,"ف٢ · Unit 13: What Are You Going to Wear There?"],[132,"ف٢ · Unit 14: Let’s Celebrate"],[140,"ف٢ · Unit 15: Then and Now"],[148,"ف٢ · Unit 16: What Did You Do Last Week?"],[156,"ف٢ · مراجعة الوحدات ١٣–١٦"],[162,"المفردات (Vocabulary)"],[188,"الأفعال الشاذة (Irregular Verbs)"],[191,"كتاب التمارين (Workbook)"]]
};
const ar=n=>n.toLocaleString("ar-SA");
const st={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
/* الأسس في حلول الرياضيات: ٣^٤ تنكتب ٣ وفوقها ٤ */
const fmt=s=>esc(s).replace(/\^(−?[0-9٠-٩]+|[a-zA-Zء-ي])/g,"<sup>$1</sup>");
const solvedCount=k=>Object.keys(SOL[k]).length;

/* الكتاب ما ينختار تلقائيًا: الطالب يختار ثم يضغط «افتح الكتاب» */
let book=null, start=null, solved=st.get("bm")!=="0", page=1;
const saved=k=>Number(st.get("bp_"+k))||0;

function renderSetup(){
  $("viewer").hidden=true;$("setup").hidden=false;$("wrap").dataset.b=book||"";
  const s=$("setup");
  let starts=[];
  if(book){
    if(saved(book)>1)starts.push([String(saved(book)),`كمّل من صفحة ${ar(saved(book))}`]);
    starts.push(["1","من أول الكتاب"],...PARTS[book].map(([p,t])=>[String(p),t]));
    if(start==null||!starts.some(([v])=>v===start))start=starts[0][0];
  }
  s.innerHTML=`<div><h2 class="stitle">افتح كتاب</h2><p class="ref">اختر الكتاب، وبعدها اضغط «افتح الكتاب».</p></div>
    <div class="sstep"><b>١. اختر الكتاب</b>
      <div class="pick2">${Object.keys(NAME).map(k=>`<button type="button" class="bpick" data-b="${k}" aria-pressed="${book===k}"><b>${NAME[k]}</b><span>${ar(N[k])} صفحة · ${solvedCount(k)?`حلول ${ar(solvedCount(k))} صفحة`:"بدون حلول للحين"}</span></button>`).join("")}</div></div>
    ${book?`<div class="sstep"><b>٢. من وين تبدأ؟</b>
      <div class="chipbar">${starts.map(([v,l])=>`<button type="button" data-s="${v}" aria-pressed="${start===v}">${l}</button>`).join("")}</div></div>
    ${solvedCount(book)?`<div class="sstep"><b>٣. محلول أو غير محلول؟</b>
      <div class="chipbar"><button type="button" data-m="1" aria-pressed="${solved}">محلول: الحلول مكتوبة على الصفحة</button><button type="button" data-m="0" aria-pressed="${!solved}">غير محلول: أحل بنفسي</button></div></div>`:""}`:""}
    <button type="button" class="btn" id="go" ${book?"":"disabled"}>${book?"افتح الكتاب":"اختر الكتاب أولًا"}</button>`;
  s.querySelectorAll(".bpick").forEach(b=>b.onclick=()=>{if(book!==b.dataset.b){book=b.dataset.b;start=null}renderSetup()});
  s.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{start=b.dataset.s;renderSetup()});
  s.querySelectorAll(".chipbar [data-m]").forEach(b=>b.onclick=()=>{solved=b.dataset.m==="1";st.set("bm",solved?"1":"0");renderSetup()});
  $("go").onclick=()=>{if(!book)return;page=Number(start)||1;$("setup").hidden=true;$("viewer").hidden=false;render();scrollTo({top:0})};
}

function render(){
  page=Math.min(Math.max(1,page),N[book]);
  $("wrap").dataset.b=book;
  $("vtitle").textContent=NAME[book];
  document.querySelectorAll("#modes button").forEach(b=>b.setAttribute("aria-pressed",(b.dataset.m==="1")===solved));
  const has=solvedCount(book)>0;$("modes").hidden=$("jump").hidden=!has;
  $("img").height=IMG_H[book];PAGE_H=IMG_H[book]/1211;
  $("img").src=`b/${book}/${String(page).padStart(3,"0")}.webp`;$("img").alt=`${NAME[book]} – صفحة ${ar(page)} من الكتاب`;
  $("num").value=page;$("num").max=N[book];$("of").textContent=`من ${ar(N[book])}`;
  const list=SOL[book][page], keys=Object.keys(SOL[book]).map(Number).sort((a,b)=>a-b);
  $("jump").innerHTML=`<option value="">صفحات فيها حلول (${ar(keys.length)})</option>`+keys.map(k=>`<option value="${k}" ${k===page?"selected":""}>صفحة ${ar(k)}</option>`).join("");
  $("hint").textContent=!has?"هذا الكتاب للحين بدون حلول.":!list?"ما فيه أسئلة في هذه الصفحة. استخدم قائمة «صفحات فيها حلول» للتنقل."
    :solved?(list.some(([,a,b])=>Array.isArray(a)||b)?"الحلول مكتوبة بالأزرق على الصفحة. اضغط على أي حل عشان تكبّره.":"حلول هذه الصفحة تحتها."):"الحلول مخفية. اختر «محلول» عشان تطلع على الصفحة.";
  drawAnswers(solved&&list?list:[]);
  /* الحلول اللي ما انحدد مكانها على الصفحة للحين تطلع تحت الصفحة */
  const rest=solved&&list?list.filter(([,a,b])=>!Array.isArray(a)&&!b):[], s=$("sol");
  s.hidden=!rest.length;
  s.innerHTML=rest.length?`<h2>حلول هذه الصفحة</h2>`+rest.map(([q,a])=>`<div><div class="q">${esc(q)}</div><div class="a">${fmt(a)}</div></div>`).join(""):"";
  st.set("bm",solved?"1":"0");st.set("bp_"+book,page);
}

/* الحلول المكتوبة على الصفحة: كل حل في مربعه [يسار، أعلى، يمين، أسفل، عدد السطور، ١ = في وسط المربع، ٢ = وكل سطر في الوسط] */
let PAGE_H=1454/1211; /* ارتفاع الصفحة بالنسبة لعرضها */
function drawAnswers(list){
  const pg=$("pg");pg.querySelectorAll(".ans,.pop").forEach(e=>e.remove());
  list.forEach(([q,a,b])=>{
    const parts=Array.isArray(a)?a:[[a,b]];
    parts.forEach(([t,bx])=>{
      if(!bx)return;
      const el=document.createElement("button");el.type="button";el.className="ans";
      el.innerHTML=`<span>${fmt(t)}</span>`;el.setAttribute("aria-expanded","false");el.setAttribute("aria-label",`${q}: ${t.replace(/\^/g," أس ")}`);
      el.style.cssText=`left:${bx[0]}%;top:${bx[1]}%;width:${bx[2]-bx[0]}%;height:${bx[3]-bx[1]}%`;
      el.dataset.rows=bx[4]||1;el.dataset.h=(bx[3]-bx[1])*PAGE_H;
      if(bx[5])el.classList.add("one");
      if(bx[5]===2||bx[2]-bx[0]<15)el.classList.add("mid");
      el.onclick=e=>{e.stopPropagation();pop(el,q,Array.isArray(a)?a.map(p=>p[0]).join("، "):t,bx)};
      pg.appendChild(el);
    });
  });
  fitAll();
}
/* يصغّر الخط لين يدخل الحل في مكانه. القياس بـ cqw فيبقى صحيح على أي عرض */
function fitAll(){
  $("pg").querySelectorAll(".ans").forEach(el=>{
    const h=Number(el.dataset.h), rows=Number(el.dataset.rows);
    const fits=()=>el.scrollHeight<=el.clientHeight+1&&el.scrollWidth<=el.clientWidth+1;
    /* يصغّر الخط على نفس عدد السطور أولًا، وما يزيد السطور إلا إذا صار الخط صغير جدًا */
    for(let r=rows;r<=rows*3+2;r++){
      const lh=h/r;let fs=Math.min(2.5,lh*.74);
      el.style.lineHeight=lh+"cqw";
      while(fs>=(r===rows?1.35:.9)){el.style.fontSize=fs+"cqw";if(fits())return;fs*=.95}
    }
    let fs=parseFloat(el.style.fontSize);
    while(!fits()&&fs>.8){fs*=.9;el.style.fontSize=fs+"cqw";el.style.lineHeight=fs*1.25+"cqw"}
  });
}
function pop(el,q,t,bx){
  const pg=$("pg"),open=el.getAttribute("aria-expanded")==="true";
  pg.querySelectorAll(".pop").forEach(e=>e.remove());pg.querySelectorAll(".ans").forEach(e=>e.setAttribute("aria-expanded","false"));
  if(open)return;
  const p=document.createElement("div");p.className="pop";p.setAttribute("role","status");
  p.innerHTML=`<small>${esc(q)}</small><b>${fmt(t)}</b>`;
  const below=bx[3]<70;p.style[below?"top":"bottom"]=below?`calc(${bx[3]}% + 6px)`:`calc(${100-bx[1]}% + 6px)`;
  pg.appendChild(p);el.setAttribute("aria-expanded","true");
}
document.addEventListener("click",()=>{const p=document.querySelector(".pop");if(p){p.remove();document.querySelectorAll(".ans").forEach(e=>e.setAttribute("aria-expanded","false"))}});
if(document.fonts)document.fonts.ready.then(fitAll);
$("img").addEventListener("load",fitAll);
$("change").onclick=()=>{start=String(page);renderSetup();scrollTo({top:0})};
document.querySelectorAll("#modes button").forEach(b=>b.onclick=()=>{solved=b.dataset.m==="1";render()});
$("prev").onclick=()=>{page--;render();scrollTo({top:0})};
$("next").onclick=()=>{page++;render();scrollTo({top:0})};
$("num").onchange=()=>{page=Number($("num").value)||1;render()};
$("jump").onchange=()=>{if($("jump").value){page=Number($("jump").value);render();scrollTo({top:0})}};
/* رابط مباشر لصفحة: books.html#e-16 (من البحث واسأل فاهم) */
const hm=location.hash.match(/^#(\w+)-(\d+)$/);
if(hm&&N[hm[1]]){book=hm[1];page=Number(hm[2]);solved=true;$("setup").hidden=true;$("viewer").hidden=false;render()}
else renderSetup();
</script>

<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الجدول الدراسي · فاهم</title>
<meta name="theme-color" content="#fbf6e8">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="tools.css?v=20261014">
<script src="theme.js"></script>
<script src="progress.js?v=20261014"></script>
<style>
/* Layout: weekly timetable (days as rows, periods as columns), scrolls sideways on phones; today's row is highlighted */
.wrap{max-width:1100px}
.tt-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.tt{border-collapse:separate;border-spacing:0;min-width:900px;width:100%;text-align:center}
.tt th,.tt td{padding:8px 6px;border-bottom:1px solid var(--line);border-inline-start:1px solid var(--line);vertical-align:middle}
.tt tr>*:first-child{border-inline-start:0}
.tt tbody tr:last-child>*{border-bottom:0}
.tt thead th{font-family:var(--display);font-size:.95rem;line-height:1.4;background:var(--bg)}
.tt thead small{display:block;font-family:var(--body);font-weight:400;font-size:.74rem;color:var(--muted);font-variant-numeric:tabular-nums;direction:ltr}
.tt th.day{font-family:var(--display);font-size:1.05rem;background:var(--bg);position:sticky;inset-inline-start:0;z-index:1;min-width:84px}
.tt tr.today>*{background:var(--gold-soft)}
.tt tr.today th.day::after{content:"اليوم";display:block;font-family:var(--body);font-size:.7rem;color:var(--gold)}
.tt td.brk{width:44px;padding:0;background:var(--bg);color:var(--muted);font-size:.8rem;writing-mode:vertical-rl;letter-spacing:.05em}
.cell{display:flex;flex-direction:column;gap:2px;align-items:center;border-top:3px solid var(--c,var(--line));padding-top:4px}
.cell b{font-family:var(--display);font-size:1rem;line-height:1.45}
.cell small{color:var(--muted);font-size:.74rem;line-height:1.4}
.s-quran{--c:#2e9e5b}.s-math{--c:#d9463a}.s-sci{--c:#e08a1e}.s-ar{--c:#3b82d9}.s-en{--c:#7a5fc4}
.s-soc{--c:#e0572a}.s-pe{--c:#8a8a8a}.s-dig{--c:#c065d4}.s-life{--c:#2bb5b5}.s-art{--c:#d9b81e}.s-taj{--c:#2e9e5b}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.82rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--c);margin-inline-end:5px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="logo" href="./" aria-label="فاهم · الصفحة الرئيسية"><span class="logo-mark" aria-hidden="true">ف</span><span class="logo-word">فاهم<small>ملخصات أول متوسط</small></span></a>
  </header>

  <div class="page-head">
    <h1>📅 الجدول الدراسي</h1>
    <p>حصصك من الأحد إلى الخميس، مع أسماء المعلمين وأوقات الحصص. صف اليوم مظلّل.</p>
  </div>

  <div class="tt-scroll"><table class="tt" id="tt" aria-label="الجدول الدراسي الأسبوعي"></table></div>
  <div class="legend" id="legend"></div>
</div>

<script>
const P=[["الأولى","6:40 – 7:25"],["الثانية","7:25 – 8:10"],["الثالثة","8:10 – 8:55"],null,["الرابعة","9:15 – 10:00"],["الخامسة","10:00 – 10:45"],["السادسة","10:45 – 11:30"],null,["السابعة","11:50 – 12:35"]];
const BRK=[["الفسحة","8:55 – 9:15"],["صلاة الظهر","11:30 – 11:50"]];
const SUB={q:["قرآن وإسلامية","s-quran","عبدالله الشهري"],m:["رياضيات","s-math","نايف العتيبي"],s:["علوم","s-sci","فهاد الجبيري"],a:["لغتي","s-ar","محمد الشمري"],e:["إنجليزي","s-en","طارق الشهري"],
  c:["اجتماعيات","s-soc","بدر المطيري"],p:["بدنية","s-pe","خالد الجاسم"],d:["م رقمية","s-dig","عبدالكريم الحربي"],l:["م حياتية","s-life","محمد الشمري"],f:["فنية","s-art","علي البوعينين"],t:["تجويد","s-taj","أنس الرحمة"]};
/* الأيام الدراسية بالترتيب، وكل حرف حصة من الأولى للسابعة */
const DAYS=[["الأحد",0,"mqseadq"],["الاثنين",1,"spaqemq"],["الثلاثاء",2,"lcqsmda"],["الأربعاء",3,"aqmsqme"],["الخميس",4,"cqmtaef"]];
const cell=k=>{const s=SUB[k];return `<td><div class="cell ${s[1]}"><b>${s[0]}</b><small>${s[2]}</small></div></td>`};
const today=new Date().getDay();
let h="<thead><tr><th class='day'></th>";
let bi=0;
P.forEach(p=>{if(p)h+=`<th>${p[0]}<small>${p[1]}</small></th>`;else{const b=BRK[bi++];h+=`<th>${b[0]}<small>${b[1]}</small></th>`}});
h+="</tr></thead><tbody>";
DAYS.forEach(([n,g,row])=>{
  h+=`<tr${g===today?' class="today"':''}><th class="day" scope="row">${n}</th>`;
  let i=0,j=0;
  P.forEach(p=>{if(p)h+=cell(row[i++]);else h+=`<td class="brk">${j++?"صلاة":"فسحة"}</td>`});
  h+="</tr>";
});
document.getElementById("tt").innerHTML=h+"</tbody>";
document.getElementById("legend").innerHTML=Object.values(SUB).filter((s,i,a)=>a.findIndex(x=>x[0]===s[0])===i).map(s=>`<span class="${s[1]}"><i></i>${s[0]}</span>`).join("");
</script>
</body>
</html>
